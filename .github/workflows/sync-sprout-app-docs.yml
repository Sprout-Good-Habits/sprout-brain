# Keep the docs in this repo that are copies of sprout-app's live contract
# from drifting away from it.
#
# The one file this owns today, canvas/sdk.md, fell 557 lines behind before
# anyone noticed — and because this repo installs as a plugin, the stale copy
# was being taught to everyone who installed it. The script now regenerates it
# from the server's own public guides endpoint, so the copy cannot describe a
# contract the deployed server does not have.
#
# Reads a PUBLIC URL, so there is no sprout-app checkout and no cross-repo
# credential anywhere in this workflow. The only token is the default
# same-repo GITHUB_TOKEN used to push the result back here.

name: Sync docs from sprout-app

on:
  schedule:
    # Daily, well after the usual release window, so a morning deploy is
    # reflected the same day rather than a day late.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      base:
        description: 'Server to sync from (defaults to production)'
        required: false
        default: 'https://api.sproutgoodhabits.com'

permissions:
  contents: write

concurrency:
  # A scheduled run and a manual one must never race to commit the same file.
  group: sync-sprout-app-docs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate mirrored docs
        run: node scripts/sync-sprout-app-docs.mjs --base "${BASE}"
        env:
          BASE: ${{ inputs.base || 'https://api.sproutgoodhabits.com' }}

      - name: Commit if the upstream document changed
        run: |
          if git diff --quiet; then
            echo "No change — the mirrored docs already match the server."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          # The banner carries no timestamp, so a diff here means the upstream
          # document itself changed — worth a commit, and only then.
          git commit -m "docs: sync mirrored docs from the Sprout server

          Regenerated by scripts/sync-sprout-app-docs.mjs from the public
          guides endpoint. Edit the source in sprout-app, not this copy."
          git push
